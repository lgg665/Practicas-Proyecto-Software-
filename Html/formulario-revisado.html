```html
<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Codificación de caracteres -->
    <meta charset="UTF-8">

    <!-- Título de la página -->
    <title>Formulario</title>
</head>

<body>

    <!--
        Formulario de Datos Personales.
        Contiene información sobre nombre y apellido,
        correo electrónico, fecha de nacimiento,
        descripción, sexo, profesión y provincia.
    -->

    <header>
        <h1>Formulario de Datos Personales</h1>
    </header>

    <main>

        <form>

            <!-- Agrupa los datos personales -->
            <fieldset>

                <legend>Datos Personales</legend>


                <!-- Nombre y apellido -->
                <label for="nombre">
                    Nombre y Apellido:
                </label>

                <br>

                <input type="text"
                       id="nombre"
                       name="nombre"
                       required>

                <br><br>


                <!-- Correo electrónico -->
                <label for="mail">
                    Mail:
                </label>

                <br>

                <input type="email"
                       id="mail"
                       name="mail"
                       placeholder="ejemplo@correo.com"
                       required>

                <br><br>


                <!-- Fecha de nacimiento -->
                <label for="fecha">
                    Fecha de Nacimiento:
                </label>

                <br>

                <input type="date"
                       id="fecha"
                       name="fecha"
                       required>

                <br><br>


                <!-- Descripción -->
                <label for="descripcion">
                    Descripción:
                </label>

                <br>

                <textarea id="descripcion"
                          name="descripcion"
                          rows="4"
                          cols="50"
                          placeholder="Ingrese una descripción..."></textarea>

                <br><br>


                <!-- Sexo -->
                <fieldset>

                    <legend>Sexo</legend>

                    <input type="radio"
                           id="masculino"
                           name="sexo"
                           value="Masculino"
                           required>

                    <label for="masculino">
                        Masculino
                    </label>

                    <br>

                    <input type="radio"
                           id="femenino"
                           name="sexo"
                           value="Femenino">

                    <label for="femenino">
                        Femenino
                    </label>

                </fieldset>

                <br>


                <!-- Profesión -->
                <fieldset>

                    <legend>
                        Profesión
                    </legend>

                    <p>
                        Indique su profesión
                        (escoja todas las que procedan):
                    </p>

                    <input type="checkbox"
                           id="medico"
                           name="profesion"
                           value="Medico">

                    <label for="medico">
                        Médico
                    </label>

                    <br>

                    <input type="checkbox"
                           id="programador"
                           name="profesion"
                           value="Programador">

                    <label for="programador">
                        Programador
                    </label>

                    <br>

                    <input type="checkbox"
                           id="ingeniero"
                           name="profesion"
                           value="Ingeniero">

                    <label for="ingeniero">
                        Ingeniero
                    </label>

                </fieldset>

                <br>


                <!-- Provincia -->
                <label for="provincia">
                    Provincia:
                </label>

                <br>

                <select id="provincia"
                        name="provincia"
                        required>

                    <option value="">
                        Seleccione una provincia
                    </option>

                    <option value="Buenos Aires">
                        Buenos Aires
                    </option>

                    <option value="Cordoba">
                        Córdoba
                    </option>

                    <option value="Rio Negro">
                        Río Negro
                    </option>

                    <option value="Mendoza">
                        Mendoza
                    </option>

                </select>

                <br><br>


                <!-- Botón para enviar el formulario -->
                <input type="submit"
                       value="Enviar">

                <!-- Botón para limpiar el formulario -->
                <input type="reset"
                       value="Limpiar">

            </fieldset>

        </form>

    </main>


    <!-- Pie de página -->
    <footer>

        <p>
            Formulario de Datos Personales -
            <time datetime="2026">2026</time>
        </p>

    </footer>

</body>

</html>
```
