<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Mouse</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f4ead5;

            font-family: Arial, sans-serif;
        }

        .loading {
            width: 500px;
            text-align: center;
        }

        .loading h1 {
            margin-bottom: 40px;
            color: #5b4636;
        }

        /* CONTENEDOR DE LA BARRA */

        .loading-bar {
            position: relative;

            width: 100%;
            height: 70px;

            background: #d6c2a5;

            border: 5px solid #5b4636;
            border-radius: 40px;

            overflow: hidden;
        }

        /* PROGRESO */

        .progress {
            position: absolute;

            left: 0;
            top: 0;

            height: 100%;
            width: 0%;

            background: #f5c542;

            border-radius: 30px;

            animation: loading 6s linear infinite;
        }

        /* RATÓN */

        .mouse {
            position: absolute;

            top: 50%;

            left: 0;

            transform: translate(-50%, -50%);

            font-size: 42px;

            z-index: 3;

            animation: mouseMove 6s linear infinite;
        }

        /* QUESO */

        .cheese {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 42px;

            z-index: 4;
        }

        /* TEXTO */

        .loading-text {
            margin-top: 20px;

            font-size: 20px;
            font-weight: bold;

            color: #5b4636;

            animation: textAnimation 6s linear infinite;
        }


        /* ========================
           ANIMACIONES
        ======================== */

        @keyframes loading {

            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }

        }


        @keyframes mouseMove {

            0% {
                left: 0%;
            }

            100% {
                left: 94%;
            }

        }


        @keyframes textAnimation {

            0% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }

        }
    </style>
</head>

<body>

    <main class="loading">

        <h1>El ratón está buscando el queso... 🐭</h1>

        <section class="loading-bar">

            <div class="progress"></div>

            <span class="mouse">
                🐭
            </span>

            <span class="cheese">
                🧀
            </span>

        </section>

        <p class="loading-text">
            Cargando...
        </p>

    </main>

</body>
</html>
