<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Calendario</title>

    <link rel="stylesheet" href="calendario.css">

</head>

<body>

    <main class="calendario-container">


        <!-- =========================
             ENCABEZADO
        ========================== -->

        <header class="calendario-header">

            ☰ Calendario

        </header>


        <div class="contenido">


            <!-- =========================
                 FORMULARIO
            ========================== -->

            <aside class="formulario-evento">

                <h2>Agregar Evento</h2>

                <form id="eventoForm">


                    <label for="fechaInicio">
                        Desde
                    </label>

                    <input
                        type="date"
                        id="fechaInicio"
                        required>


                    <label for="fechaFin">
                        Hasta
                    </label>

                    <input
                        type="date"
                        id="fechaFin"
                        required>


                    <input
                        type="text"
                        id="tituloEvento"
                        placeholder="Título del Evento..."
                        required>


                    <button type="submit">
                        Agregar Evento
                    </button>

                </form>

            </aside>


            <!-- =========================
                 CALENDARIO
            ========================== -->

            <section class="calendario">

                <h2>Agosto 2013</h2>


                <!-- DÍAS DE LA SEMANA -->

                <div class="dias">

                    <div>DOM</div>
                    <div>LUN</div>
                    <div>MAR</div>
                    <div>MIE</div>
                    <div>JUE</div>
                    <div>VIE</div>
                    <div>SAB</div>

                </div>


                <!-- =========================
                     SEMANA 1
                ========================== -->

                <div class="semana">

                    <div class="dia otro-mes">
                        <span>28</span>
                    </div>

                    <div class="dia otro-mes">
                        <span>29</span>
                    </div>

                    <div class="dia otro-mes">
                        <span>30</span>
                    </div>

                    <div class="dia otro-mes">
                        <span>31</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-01">
                        <span>1</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-02">
                        <span>2</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-03">
                        <span>3</span>
                    </div>


                    <!-- Evento 1 ocupa solamente el día 2 -->

                    <div
                        class="evento evento-naranja evento-1"
                        style="left: 71.428%; width: 14.285%;">

                        Evento 1
                    </div>

                </div>


                <!-- =========================
                     SEMANA 2
                ========================== -->

                <div class="semana">

                    <div class="dia" data-fecha="2013-08-04">
                        <span>4</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-05">
                        <span>5</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-06">
                        <span>6</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-07">
                        <span>7</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-08">
                        <span>8</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-09">
                        <span>9</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-10">
                        <span>10</span>
                    </div>

                </div>


                <!-- =========================
                     SEMANA 3
                ========================== -->

                <div class="semana">

                    <div class="dia" data-fecha="2013-08-11">
                        <span>11</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-12">
                        <span>12</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-13">
                        <span>13</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-14">
                        <span>14</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-15">
                        <span>15</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-16">
                        <span>16</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-17">
                        <span>17</span>
                    </div>


                    <!-- Evento que ocupa 11, 12 y 13 -->

                    <div
                        class="evento evento-verde evento-2"
                        style="left: 0%; width: 42.857%;">
                        
                        
                        Evento 2
                    </div>


                    <!-- Reunión -->

                    <div
                        class="evento evento-azul evento-reunion"
                        style="left: 57.142%; width: 14.285%;">

                        10:30am<br>
                        Reunión

                    </div>


                    <!-- Cumpleaños -->

                    <div
                        class="evento evento-morado evento-cumple"
                        style="left: 71.428%; width: 14.285%;">

                        7pm<br>
                        Cumpleaños

                    </div>

                </div>


                <!-- =========================
                     SEMANA 4
                ========================== -->

                <div class="semana">

                    <div class="dia" data-fecha="2013-08-18">
                        <span>18</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-19">
                        <span>19</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-20">
                        <span>20</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-21">
                        <span>21</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-22">
                        <span>22</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-23">
                        <span>23</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-24">
                        <span>24</span>
                    </div>

                </div>


                <!-- =========================
                     SEMANA 5
                ========================== -->

                <div class="semana">

                    <div class="dia" data-fecha="2013-08-25">
                        <span>25</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-26">
                        <span>26</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-27">
                        <span>27</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-28">
                        <span>28</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-29">
                        <span>29</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-30">
                        <span>30</span>
                    </div>

                    <div class="dia" data-fecha="2013-08-31">
                        <span>31</span>
                    </div>

                </div>

            </section>

        </div>

    </main>


    <script src="calendario.js"></script>

</body>

</html>
